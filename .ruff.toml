# Python lint and format contract.
#
# The rule set is declared here rather than inherited from the tool default.
# Ruff's default selection widened between 0.15 and 0.16, which would have
# changed what CI enforces without any change to this repository. Other pinned
# linters may intentionally retain reviewed defaults; Ruff names this selection
# because its observed default change crossed this repository's rule boundary.
#
# See .agents/governance/formatting-and-linting.md before
# widening the selection: each added family needs its findings measured and
# resolved, not suppressed.

[lint]
# Pyflakes plus the pycodestyle errors that indicate a real defect rather
# than a layout preference. The formatter below owns layout.
select = ["E4", "E7", "E9", "F"]

[format]
# The pinned formatter defaults intentionally match the corpus: double quotes
# and an 88 column target. Revalidate them when raising the Ruff revision.
