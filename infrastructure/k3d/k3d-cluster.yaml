apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: hyhome
image: rancher/k3s:v1.35.0-k3s1
servers: 1
agents: 3
kubeAPI:
  host: 0.0.0.0
  hostPort: '6550'
# k8s router (ADR-0043): the serverlb binds only the dedicated host address and
# forwards to the fixed ingress-nginx NodePorts.
ports:
  - port: 192.168.0.14:80:30080
    nodeFilters:
      - loadbalancer
  - port: 192.168.0.14:443:30443
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: '180s'
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
