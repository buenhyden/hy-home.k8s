title = "hy-home.k8s gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow the detect-secrets baseline artifact tracked in this repository"
paths = [
  '''^\.secrets\.baseline$''',
]

[[allowlists]]
description = "Skip Git metadata before snapshot directory traversal; source files remain scanned"
paths = [
  '''(?:^|/)\.git(?:/|$)''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "A sealed scope statement names public observability products"
  condition = "AND"
  paths = [
    '''^docs/98\.archive/completed/03\.specs/0024-observability-and-network-review-agents/spec\.md$''',
  ]
  regexTarget = "secret"
  regexes = ['''^Prometheus/Grafana$''']

  [[rules.allowlists]]
  description = "The retained execution plan names a noninteractive GitHub CLI control"
  condition = "AND"
  paths = [
    '''^docs/03\.specs/0062-workspace-research-full-corpus-reverification/plan\.md$''',
  ]
  regexTarget = "secret"
  regexes = ['''^GH_PROMPT_DISABLED=1$''']

  [[rules.allowlists]]
  description = "Allow WORK-105 native template SHA256 fixture map entries"
  condition = "AND"
  paths = [
    '''(?:^|/)tests/test_document_strict_cutover\.py$''',
  ]
  regexTarget = "line"
  regexes = [
    '''"(openapi\.template\.yaml|schema\.template\.graphql|service\.template\.proto)": "[0-9a-f]{64}",''',
  ]
