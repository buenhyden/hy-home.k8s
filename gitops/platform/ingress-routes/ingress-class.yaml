# IngressClass `nginx` is owned by this neutral manifest, tracked by
# platform-ingress-routes; no controller chart renders it (SPEC-0121).
# Traefik's Ingress-NGINX provider serves it under the ingress-nginx
# controller name, so the existing Ingresses keep their class.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx
