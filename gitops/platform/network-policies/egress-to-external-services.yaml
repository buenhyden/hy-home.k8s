apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external-services
  namespace: platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # OpenBao through the external Traefik and mng-valkey, both on the host
    # address (ADR-0046)
    - to:
        - ipBlock:
            cidr: 192.168.0.13/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 26379
    # kube-dns for service discovery
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (post-DNAT: k3d server node in 172.18.0.0/24, port 6443)
    - to:
        - ipBlock:
            cidr: 172.18.0.0/24
      ports:
        - protocol: TCP
          port: 6443
    # Pod-to-pod communication
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
