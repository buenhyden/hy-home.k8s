apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-secrets-egress-to-vault
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # OpenBao at https://openbao.hy.home.arpa (external Traefik on the host
    # address, ADR-0046)
    - to:
        - ipBlock:
            cidr: 192.168.0.13/32
      ports:
        - protocol: TCP
          port: 443
    # kube-dns resolves openbao.hy.home.arpa (coredns-custom zone)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server for controller reconciliation
    - to:
        - ipBlock:
            cidr: 172.18.0.0/24
      ports:
        - protocol: TCP
          port: 6443
