# Grafana Viewer service account token for Kiali calls to
# https://grafana.hy.home.arpa; Grafana allows no anonymous access (ADR-0046)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kiali-grafana-auth
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kiali-grafana-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: token # pragma: allowlist secret
      remoteRef:
        key: platform/grafana-api
        property: token
