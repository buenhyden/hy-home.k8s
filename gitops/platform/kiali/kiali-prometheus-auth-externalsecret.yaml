# Basic Auth for Kiali queries to https://prometheus.hy.home.arpa (ADR-0046)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kiali-prometheus-auth
  namespace: istio-system
  annotations:
    # Before the Deployment that mounts the Secret: Argo CD waits for a wave to
    # be healthy, and the consumer cannot start without it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kiali-prometheus-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: username
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: password
