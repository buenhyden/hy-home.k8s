# Basic Auth for Alloy remote write to https://prometheus.hy.home.arpa (ADR-0046)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prometheus-api-auth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: prometheus-api-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: username
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: password
