# Alloy in-cluster — k3d/k3s 파드 로그, Kubernetes 이벤트, 메트릭 수집
# 역할: k3d 클러스터 내부에서 실행되어 로그는 외부 Loki로, 메트릭은 외부
# Prometheus remote write로 push한다 (ADR-0045). 저장과 조회는 외부 workspace 소유.
# 외부 Docker Alloy는 Docker daemon 소켓 기반이라 containerd(k3d) 파드 로그를 볼 수 없음
# 이 Alloy는 loki.source.kubernetes 컴포넌트로 k8s API 경유 로그 수집 수행
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-k8s-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy-k8s-logs
    app.kubernetes.io/component: log-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8s-logs
  labels:
    app.kubernetes.io/name: alloy-k8s-logs
rules:
  - apiGroups: ['']
    resources: [nodes, nodes/proxy, services, endpoints, pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [events]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8s-logs
  labels:
    app.kubernetes.io/name: alloy-k8s-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-k8s-logs
subjects:
  - kind: ServiceAccount
    name: alloy-k8s-logs
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-k8s-logs-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy-k8s-logs
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // ----------------------------------------------------------------
    // 1. Kubernetes 파드 로그 수집
    //    loki.source.kubernetes: k8s API 경유로 파드 로그 tail
    //    → 외부 Loki(loki-external.platform.svc.cluster.local:3100)로 전송
    // ----------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // 애노테이션 observability.logs/disabled: "true" 이면 수집 제외
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_observability_logs_disabled"]
        regex         = "(?i)true|yes|1"
        action        = "drop"
      }

      // Completed/Succeeded 파드는 로그 수집에서 제외
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Succeeded|Failed"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      rule {
        target_label = "cluster"
        replacement  = "k3d-hyhome"
      }

      rule {
        target_label = "env"
        replacement  = "dev"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.external_loki.receiver]
    }

    // ----------------------------------------------------------------
    // 2. Kubernetes 이벤트 수집
    //    클러스터 이벤트(FailedScheduling, Evicted, OOMKilled 등)를 로그로 기록
    // ----------------------------------------------------------------
    loki.source.kubernetes_events "events" {
      namespaces = []
      forward_to = [loki.process.events_label.receiver]
    }

    loki.process "events_label" {
      stage.static_labels {
        values = {
          cluster = "k3d-hyhome",
          env     = "dev",
          job     = "kubernetes-events",
        }
      }
      forward_to = [loki.write.external_loki.receiver]
    }

    // ----------------------------------------------------------------
    // 3. 외부 Loki 전송
    //    loki-external.platform.svc.cluster.local: ExternalService (172.18.0.13:3100)
    // ----------------------------------------------------------------
    loki.write "external_loki" {
      endpoint {
        url = "http://loki-external.platform.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // ----------------------------------------------------------------
    // 4. 메트릭 수집 (ADR-0045) → 외부 Prometheus remote write
    //    pod IP와 API server proxy로 scrape하므로 k3d node 주소나 NodePort에
    //    의존하지 않는다.
    // ----------------------------------------------------------------

    // 4-1. prometheus.io annotation pod. Istio sidecar가 주입된 pod는
    //      15020 /stats/prometheus 병합 메트릭(istio_requests_total 포함)과
    //      istiod 15014가 여기로 들어온다. 포트마다 생기는 중복 target은
    //      relabel 뒤 label이 같아져 scrape manager가 하나로 합친다.
    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }

      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator     = ""
        target_label  = "app"
      }
    }

    // 4-2. annotation이 없는 플랫폼 component는 namespace, 이름, container
    //      port로 고정한다.
    discovery.relabel "platform_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_port_number"]
        regex         = "argocd;argocd-(application-controller;8082|server;8083|repo-server;8084|applicationset-controller;8080|notifications-controller;9001)|argo-rollouts;argo-rollouts;8090|monitoring;kube-state-metrics;8080"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    prometheus.scrape "pods" {
      targets         = array.concat(discovery.relabel.annotated_pods.output, discovery.relabel.platform_pods.output)
      job_name        = "kubernetes-pods"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.external_prometheus.receiver]
    }

    // 4-3. kubelet과 cAdvisor는 API server proxy로 가져온다 (nodes/proxy).
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc:443"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        replacement   = "/api/v1/nodes/$1/proxy/metrics"
        target_label  = "__metrics_path__"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    discovery.relabel "cadvisor" {
      targets = discovery.relabel.kubelet.output

      rule {
        source_labels = ["node"]
        regex         = "(.+)"
        replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
        target_label  = "__metrics_path__"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.remote_write.external_prometheus.receiver]
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      job_name          = "cadvisor"
      scheme            = "https"
      scrape_interval   = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.remote_write.external_prometheus.receiver]
    }

    // 4-4. 외부 Prometheus remote write
    //      prometheus-external.platform.svc.cluster.local: ExternalService (172.18.0.10:9090)
    prometheus.remote_write "external_prometheus" {
      external_labels = {
        cluster = "k3d-hyhome",
        env     = "dev",
      }

      endpoint {
        url = "http://prometheus-external.platform.svc.cluster.local:9090/api/v1/write"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-k8s-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy-k8s-logs
    app.kubernetes.io/component: log-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-k8s-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-k8s-logs
        app.kubernetes.io/component: log-collector
    spec:
      serviceAccountName: alloy-k8s-logs
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        # Restricted 프로파일이 요구하는 유일한 잔여 항목이다. Baseline은 요구하지
        # 않으므로, 이 항목만 빠진 워크로드는 잘 하드닝된 것처럼 보인다.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: storage
              mountPath: /var/lib/alloy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-k8s-logs-config
        - name: storage
          emptyDir: {}
