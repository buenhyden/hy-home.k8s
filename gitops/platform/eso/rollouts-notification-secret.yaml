# Slack app token for the Argo Rollouts notification engine (ADR-0054
# clause 2). Same OpenBao entry as argocd-notifications-secret; the chart
# asks a hand-made secret to carry the controller component label.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: argo-rollouts-notification-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: rollouts-controller
  data:
    - secretKey: slack-token # pragma: allowlist secret
      remoteRef:
        key: platform/notifications
        property: slack_token
