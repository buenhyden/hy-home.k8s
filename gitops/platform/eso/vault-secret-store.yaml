apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    platform.hyhome.io/environment-scope: local-only
    platform.hyhome.io/validation-role: eso-read-platform
    platform.hyhome.io/validation-serviceaccount: external-secrets
    platform.hyhome.io/validation-namespace: external-secrets
spec:
  provider:
    vault:
      # ADR-0046: OpenBao through the external Traefik; CoreDNS resolves the
      # name to the host address and the mkcert root CA pins the certificate.
      server: "https://openbao.hy.home.arpa"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
        namespace: external-secrets
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-read-platform"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # OpenBao has no reviewer JWT (disable_local_ca_jwt), so it sends
            # this token to TokenReview as its own credential; the API server
            # accepts it only with its own audience next to `vault`.
            audiences:
              - vault
              - https://kubernetes.default.svc.cluster.local
