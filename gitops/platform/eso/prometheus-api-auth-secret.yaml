# Authorization header shared by every Rollouts AnalysisTemplate in apps that
# queries https://prometheus.hy.home.arpa (ADR-0046)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prometheus-api-auth
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: prometheus-api-auth
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        authorization: 'Basic {{ printf "%s:%s" .username .password | b64enc }}'
  data:
    - secretKey: username # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: username
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: platform/prometheus-api
        property: password
