apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istio-cni
  namespace: argocd
  annotations:
    # istiod(wave 2)보다 반드시 먼저 준비되어야 한다. istiod가 pilot.cni.enabled로
    # 전환되면 주입 init container가 istio-validation으로 바뀌는데, 그 컨테이너는
    # redirection이 설정되지 않았으면 pod 기동을 막는다. CNI가 먼저 떠야 한다.
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: platform
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.25.2
    helm:
      releaseName: istio-cni
      values: |
        # k3s는 표준 CNI 경로를 쓰지 않는다. 노드 containerd의 CNI bin_dirs는
        # /var/lib/rancher/k3s/data/cni 하나뿐이다(rancher/k3s:v1.35.0-k3s1,
        # agent/etc/containerd/config.toml). 이전 k3d 이미지처럼 /bin에 설치하면
        # chain의 istio-cni를 찾지 못해 kube-system 밖의 새 pod가 모두 sandbox
        # 생성에 실패하고, 실패마다 flannel IP가 회수되지 않는다.
        # chart의 platform profile은 명시한 cniBinDir보다 우선한다. k3d profile은
        # /bin을 렌더하므로, 두 경로가 이 노드와 같은 k3s profile을 쓴다(1.25.2의
        # 두 profile은 cniBinDir만 다르다). 두 경로도 명시적으로 남긴다.
        global:
          platform: k3s
        cniBinDir: /var/lib/rancher/k3s/data/cni
        cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
