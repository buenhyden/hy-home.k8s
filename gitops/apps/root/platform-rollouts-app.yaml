apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.40.9
    helm:
      releaseName: argo-rollouts
      values: | # pragma: allowlist secret
        controller:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          metrics:
            enabled: true
        dashboard:
          enabled: true
          # 이 차트에서 대시보드는 upstream 기본값이 enabled: false 이므로 차트 기본값
          # 그대로면 하드닝 공백이 드러나지 않는다. 이 저장소가 켰으므로 이 저장소가
          # 하드닝한다. 같은 차트의 controller는 아래 세 항목을 기본으로 갖는다.
          #
          # 세 항목 모두 이미지 정의와 포트만으로 성립한다: 이미지가
          # gcr.io/distroless/static-debian12 + `USER 999`(숫자)이고 단일 Go 바이너리라
          # setuid 전환이 없으며, 3100 포트는 1024를 넘어 NET_BIND_SERVICE가 필요 없다.
          # seccompProfile은 같은 저장소·같은 base image·같은 USER를 쓰는 controller가
          # 이미 RuntimeDefault로 동작한다.
          #
          # readOnlyRootFilesystem은 의도적으로 제외했다. controller 템플릿은 그 항목을
          # 켜면서 /tmp와 /home/argo-rollouts/plugin-bin에 emptyDir을 함께 마운트하는데,
          # 대시보드에는 볼륨이 없다. 켜려면 dashboard.volumes/volumeMounts로 쓰기 경로를
          # 먼저 확보해야 하고, 어느 경로가 필요한지는 관측이 선행되어야 한다.
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: mkcert-ca-issuer
              nginx.ingress.kubernetes.io/ssl-redirect: 'true'
            hosts:
              - rollouts.127.0.0.1.nip.io
            tls:
              - hosts:
                  - rollouts.127.0.0.1.nip.io
                secretName: rollouts-dashboard-tls
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        notifications:
          enabled: false
        serviceAccount:
          create: true
          name: argo-rollouts
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
