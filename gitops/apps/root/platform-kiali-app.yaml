apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: platform
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-operator
    targetRevision: 2.10.0
    helm:
      releaseName: kiali
      values: | # pragma: allowlist secret
        cr:
          create: true
          spec:
            auth:
              strategy: "anonymous"
            external_services:
              # Prometheus and Grafana through the external Traefik (ADR-0046).
              # The gateway CA comes from the istio-system/kiali-cabundle
              # ConfigMap that bootstrap creates.
              prometheus:
                url: "https://prometheus.hy.home.arpa"
                auth:
                  type: basic
                  username: secret:kiali-prometheus-auth:username
                  password: secret:kiali-prometheus-auth:password # pragma: allowlist secret
              grafana:
                enabled: true
                in_cluster_url: "https://grafana.hy.home.arpa"
                url: "https://grafana.hy.home.arpa"
              tracing:
                enabled: true
                provider: "tempo"
                in_cluster_url: "http://tempo-external.platform.svc.cluster.local:3200"
                use_grpc: false
            server:
              web_root: "/kiali"
        # 이 차트는 securityContext를 병합하지 않고 통째로 대체한다. seccompProfile만
        # 추가하면 차트가 하드코딩으로 주던 나머지 항목이 전부 사라져 오히려 Restricted
        # 에서 멀어지므로, 차트가 렌더하던 블록을 그대로 재현하고 한 항목만 더한다.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
