apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: platform
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.25.2
    helm:
      releaseName: istiod
      values: |
        # istiod 차트는 seccompProfile: {} 를 기본으로 두어 블록이 렌더되지 않는다.
        # 이 단일 키가 istiod를 Restricted로 올리는 유일한 잔여 항목이다.
        seccompProfile:
          type: RuntimeDefault
        pilot:
          # istio-cni(sync-wave 1)가 노드에 CNI 플러그인을 설치하므로, 주입되는
          # init container가 istio-init(NET_ADMIN+NET_RAW, runAsUser 0)에서
          # istio-validation(capabilities.add 없음, runAsUser 1337, runAsNonRoot)
          # 으로 바뀐다. 이것이 apps/ingress-nginx의 유일한 Baseline 위반을 없앤다.
          #
          # 롤백 시에는 반드시 이 값을 false로 먼저 되돌린 뒤 istio-cni Application을
          # 제거한다. 순서를 바꾸면 새 pod이 istio-init도 CNI도 받지 못한다.
          cni:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        meshConfig:
          defaultConfig:
            holdApplicationUntilProxyStarts: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy
    - group: apps
      kind: Deployment
      name: istiod
      jsonPointers:
        - /spec/progressDeadlineSeconds
        - /spec/strategy/type
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
