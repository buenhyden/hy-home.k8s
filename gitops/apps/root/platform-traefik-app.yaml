apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-traefik
  namespace: argocd
  # SPEC-0121: removing this Application deletes its resources, including
  # the cluster-scoped ones. Traefik is the k8s router (ADR-0043, ADR-0050).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      releaseName: traefik
      # Only the Ingress-NGINX provider runs; the Traefik CRDs are not needed.
      skipCrds: true
      values: |
        # k8s router (ADR-0043): the k3d serverlb forwards 192.168.0.14:80/443
        # to the fixed NodePorts below, and the Service keeps MetalLB address
        # 172.18.0.240. Traefik serves the existing `nginx` class, creates no
        # IngressClass and publishes Ingress status from this Service. The
        # chart's pod securityContext already sets seccompProfile
        # RuntimeDefault, which covers the injected sidecars.
        ingressClass:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: false
          kubernetesIngressNGINX:
            enabled: true
            # ingress-nginx buffers request bodies and rejects bodies over its
            # 1 MiB default with 413. Traefik enforces proxyBodySize (1 MiB)
            # only in its buffering middleware, which this turns on.
            proxyRequestBuffering: true
            publishService:
              enabled: true
          # The file provider holds one middleware only: the HSTS header that
          # ingress-nginx sends on every TLS response (SPEC-0121 0.4.0).
          file:
            enabled: true
            watch: false
            content:
              http:
                middlewares:
                  hsts:
                    headers:
                      stsSeconds: 31536000
                      stsIncludeSubdomains: true
        # nginx drops request headers whose names alias another header
        # (underscores_in_headers off); `delete` does the same, so a client
        # cannot spoof a header Traefik manages.
        ports:
          web:
            nodePort: 30080
            http:
              aliasHeadersStrategy: delete
          websecure:
            nodePort: 30443
            http:
              aliasHeadersStrategy: delete
              middlewares:
                - hsts@file
        service:
          annotations:
            metallb.io/loadBalancerIPs: 172.18.0.240
          spec:
            type: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # At the cutover the NodePorts and the address free only once the
    # ingress-nginx Service is deleted, so the first attempts can fail.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
