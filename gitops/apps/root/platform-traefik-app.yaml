apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-traefik
  namespace: argocd
  # SPEC-0121: removing this Application deletes its resources, including
  # the cluster-scoped ones.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      releaseName: traefik
      # Only the Ingress-NGINX provider runs; the Traefik CRDs are not needed.
      skipCrds: true
      values: |
        # SPEC-0121 side by side: ingress-nginx still holds the router
        # NodePorts and the MetalLB address. Traefik serves the existing
        # `nginx` class through its ClusterIP Service only, creates no
        # IngressClass and publishes no Ingress status (publishService stays
        # off by default). The chart's pod securityContext already sets
        # seccompProfile RuntimeDefault, which covers the injected sidecars.
        ingressClass:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: false
          kubernetesIngressNGINX:
            enabled: true
            # ingress-nginx buffers request bodies and rejects bodies over its
            # 1 MiB default with 413. Traefik enforces proxyBodySize (1 MiB)
            # only in its buffering middleware, which this turns on.
            proxyRequestBuffering: true
          # The file provider holds one middleware only: the HSTS header that
          # ingress-nginx sends on every TLS response (SPEC-0121 0.4.0).
          file:
            enabled: true
            watch: false
            content:
              http:
                middlewares:
                  hsts:
                    headers:
                      stsSeconds: 31536000
                      stsIncludeSubdomains: true
        ports:
          websecure:
            http:
              middlewares:
                - hsts@file
        service:
          spec:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
