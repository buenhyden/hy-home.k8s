apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: adminer
  namespace: apps
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: db-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
        app.kubernetes.io/component: db-admin
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          # 아래 두 항목은 이미지의 UID나 파일시스템 쓰기 여부와 무관하게 성립한다.
          # 컨테이너는 이미 비루트(`USER adminer`)로 8080을 listen하므로 특권 상승도
          # 추가 capability도 필요하지 않다.
          #
          # 같은 계층의 나머지 house 패턴은 의도적으로 적용하지 않았다:
          #   - runAsNonRoot/runAsUser: 이미지가 USER를 이름으로만 선언해
          #     (`adduser -S ... adminer`) runAsUser 없이 runAsNonRoot만 켜면
          #     kubelet이 UID를 확인하지 못해 컨테이너 기동을 거부한다. 두 필드는
          #     함께 설정해야 하며 숫자 UID 확인이 선행되어야 한다.
          #   - readOnlyRootFilesystem: PHP 세션 저장 경로에 쓰기가 필요해
          #     emptyDir 마운트가 선행되어야 한다.
          # 두 건 모두 전제조건과 함께 Spec 060에 이연 기록되어 있다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres-write-external.platform.svc.cluster.local:15432
            - name: ADMINER_DESIGN
              value: pepa-linha
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    canary:
      stableService: adminer-stable
      canaryService: adminer-canary
      trafficRouting:
        istio:
          virtualServices:
            - name: adminer
              routes:
                - primary
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: adminer-stability
        - pause:
            duration: 30s
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 100
