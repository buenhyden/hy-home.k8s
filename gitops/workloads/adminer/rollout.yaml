apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: adminer
  namespace: apps
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: db-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
        app.kubernetes.io/component: db-admin
    spec:
      # UID 999는 추측이 아니라 이미지에서 직접 읽은 값이다:
      # `/etc/passwd`에 `adminer:x:999:999::/home/adminer:/bin/sh`.
      # 이미지 config의 USER는 이름(`adminer`)이라 runAsUser 없이 runAsNonRoot만
      # 켜면 kubelet이 UID를 확인하지 못해 기동을 거부한다. 두 값을 함께 지정하고,
      # 이미지 자신의 UID/GID와 일치시켜 `/var/www/html` 소유권을 그대로 유지한다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # pod 레벨에 두는 이유가 있다. 이 네임스페이스는 istio-injection이 켜져 있고,
        # Istio는 seccompProfile을 gateway 템플릿에만 설정한다 — istio-proxy와
        # istio-validation에는 설정하지 않는다. Restricted의 seccomp 규칙은 pod 레벨
        # 값 하나 또는 모든 컨테이너의 값을 요구하므로, 주입되는 컨테이너까지 덮으려면
        # 여기에 있어야 한다. 컨테이너 레벨에만 두면 주입 pod이 Restricted에서 탈락한다.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adminer
          image: adminer:4.8.1
          # 아래 두 항목은 이미지의 UID나 파일시스템 쓰기 여부와 무관하게 성립한다.
          # 컨테이너는 이미 비루트(`USER adminer`)로 8080을 listen하므로 특권 상승도
          # 추가 capability도 필요하지 않다.
          #
          # 같은 계층의 나머지 house 패턴은 의도적으로 적용하지 않았다:
          #   - readOnlyRootFilesystem: PHP 세션 저장 경로에 쓰기가 필요해
          #     emptyDir 마운트가 선행되어야 한다. Restricted 요구사항이 아니므로
          #     이 항목만 이연 상태로 남는다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres-write-external.platform.svc.cluster.local:15432
            - name: ADMINER_DESIGN
              value: pepa-linha
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    canary:
      stableService: adminer-stable
      canaryService: adminer-canary
      trafficRouting:
        istio:
          virtualServices:
            - name: adminer
              routes:
                - primary
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: adminer-stability
        - pause:
            duration: 30s
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 100
