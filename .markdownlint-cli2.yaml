config:
  # Repository docs include templates, generated gateway docs, and long reference links.
  MD013: false
  MD025: false
  MD028: false
  MD036: false
  MD040: false
  MD051: false
  MD060: false
  MD033:
    allowed_elements:
      - div
      - br
      - p
      - feature-or-system
      - system-or-domain
      - feature-id
      - short-title
      - feature
      - topic
      - policy
      - domain
      - related-decision
      - policy-or-standard
      - system-or-domain-name
      - feature-or-stream
      - incident-title
      - subdomain
      - date
  MD024: false
  MD056: false
  MD022: false
  MD032: false
  MD034: false
  MD031: false
  MD010: false
ignores:
  - ".agent/"
  - ".git/"
  - "AGENTS.md"
  - "CLAUDE.md"
  # ArchiveEnvelope payloads are immutable recovered source bytes. Lint the
  # current archive index, but leave record bodies to the archive validators.
  # A sealed Migration record is the same kind of byte: its `content_sha256`
  # rows stop verifying the moment a formatter or a style fix edits it, so a
  # finding here would have no legal remedy.
  - "docs/98.archive/migrations/"
  - "docs/98.archive/tombstones/"

# Reporting only. The pre-commit whitespace hooks own the safe fixes, and a
# linter that rewrites files during a validation run would edit outside the
# change under review.
fix: false
