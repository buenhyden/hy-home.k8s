# Markdown lint contract for this repository.
#
# Every suppression below states why it exists and what would retire it.
# See docs/00.agent-governance/policies/formatting-and-linting.md for the
# suppression discipline and the re-measurement procedure.

config:
  # --- Deliberate authoring conventions (no retirement expected) ---
  # Governed documents wrap prose by hand and carry long reference links,
  # so a fixed print width would fight the authoring templates.
  MD013: false
  # Stage 99 forms and archive records legitimately repeat a top-level
  # heading, and the governed section vocabulary repeats headings across
  # profiles by design.
  MD025: false
  MD024: false
  # Provider gateways (AGENTS.md, CLAUDE.md) open with runtime import
  # directives rather than a heading. Suppressing the rule here keeps both
  # gateways under every other rule; a whole-file ignore would not.
  MD041: false
  # Table pipe style is owned by the Stage 99 templates.
  MD060: false

  # --- Blocked by documents the lifecycle policy forbids editing ---
  # Each rule below is violated only, or almost only, inside terminal
  # documents. Re-measure before retiring one; see the policy for how.
  MD010: false # hard tabs
  MD022: false # blanks around headings
  MD031: false # blanks around fences
  MD032: false # blanks around lists
  MD051: false # link fragments
  MD056: false # table column count
  MD033:
    # Reduced to the elements the corpus actually needs. Both appear on a
    # single line of a terminal Stage 03 plan that cannot be re-fenced.
    allowed_elements:
      - feature-or-system
      - feature-id

  # --- Living authoring debt (retire by fixing the documents) ---
  MD028: false # blank line inside blockquote
  MD034: false # bare URLs
  MD036: false # emphasis used as heading
  MD040: false # fenced code without a language

ignores:
  # ArchiveEnvelope payloads are immutable recovered source bytes. Lint the
  # current archive index, but leave record bodies to the archive validators.
  # A sealed Migration record is the same kind of byte: its `content_sha256`
  # rows stop verifying the moment a formatter or a style fix edits it, so a
  # finding here would have no legal remedy.
  - "docs/98.archive/migrations/"
  - "docs/98.archive/tombstones/"

# Reporting only. The pre-commit whitespace hooks own the safe fixes, and a
# linter that rewrites files during a validation run would edit outside the
# change under review.
fix: false
