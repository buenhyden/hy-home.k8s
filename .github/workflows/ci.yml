name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request branch policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          allowed_branch_regex='^(feat|fix|docs|refactor|test|chore|ci|release|hotfix|codex|dependabot)/'
          if [ "$BASE_REF" != "main" ]; then
            echo "PR base branch must be main, got: $BASE_REF"
            exit 1
          fi
          if ! [[ "$HEAD_REF" =~ $allowed_branch_regex ]]; then
            echo "PR source branch must start with one of: feat/, fix/, docs/, refactor/, test/, chore/, ci/, release/, hotfix/, codex/, dependabot/"
            echo "got: $HEAD_REF"
            exit 1
          fi
          printf 'branch-policy=ok base=%s head=%s\n' "$BASE_REF" "$HEAD_REF"

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/ci-validation.txt
      - name: Install repository validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary :all: --require-hashes --requirement .github/requirements/ci-validation.txt
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          gitleaks_sha256='79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' # pragma: allowlist secret
          printf '%s  %s\n' "$gitleaks_sha256" "$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Validate repository checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/qa.py ci --base-ref "$BASE_SHA"

  ci-summary:
    if: always()
    needs: [branch-policy, qa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          QA_RESULT: ${{ needs.qa.result }}
        run: |
          set -euo pipefail
          failed=0
          case "$EVENT_NAME:$BRANCH_POLICY_RESULT" in
            pull_request:success)
              branch_verdict=PASS
              ;;
            push:skipped|workflow_dispatch:skipped)
              branch_verdict=SKIP
              ;;
            *)
              branch_verdict=FAIL
              failed=1
              ;;
          esac
          case "$QA_RESULT" in
            success)
              qa_verdict=PASS
              ;;
            *)
              qa_verdict=FAIL
              failed=1
              ;;
          esac
          printf 'branch-policy result=%s verdict=%s\n' "$BRANCH_POLICY_RESULT" "$branch_verdict"
          printf 'qa result=%s verdict=%s\n' "$QA_RESULT" "$qa_verdict"
          if [ "$failed" -ne 0 ]; then
            echo 'one or more required CI gates failed closed'
            exit 1
          fi
          exit 0
