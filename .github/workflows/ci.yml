name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          event=${EVENT_NAME-}
          base=${BASE_REF-}
          head=${HEAD_REF-}
          source=${SOURCE_REF-}
          missing=0
          if [ "${EVENT_NAME+x}" != x ] || [ "${BASE_REF+x}" != x ] || [ "${HEAD_REF+x}" != x ] || [ "${SOURCE_REF+x}" != x ]; then
            missing=1
          fi
          allowed_branch_regex='^(feat|fix|docs|refactor|test|chore|ci|release|hotfix|codex|claude|dependabot)/'
          branch_result=unknown_event
          branch_verdict=FAIL
          case "$event" in
            pull_request)
              if [ "$base" != main ]; then
                branch_result=invalid_base
                echo 'PR base branch must be main'
              elif ! [[ "$head" =~ $allowed_branch_regex ]]; then
                branch_result=invalid_head
                echo 'PR source branch must start with one of: feat/, fix/, docs/, refactor/, test/, chore/, ci/, release/, hotfix/, codex/, claude/, dependabot/'
              else
                branch_result=validated
                branch_verdict=PASS
              fi
              ;;
            push|workflow_dispatch)
              if [ "$source" = refs/heads/main ]; then
                branch_result=NOT_APPLICABLE
                branch_verdict=NOT_APPLICABLE
              else
                branch_result=invalid_ref
              fi
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            branch_result=missing_metadata
            branch_verdict=FAIL
          fi
          printf 'branch-policy result=%s verdict=%s\n' "$branch_result" "$branch_verdict"
          if [ "$branch_verdict" = FAIL ]; then
            exit 1
          fi
          exit 0
      - name: Checkout reviewed base for PR title
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          sparse-checkout: /.cz.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pull request merge for commit messages
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate-commits
          # Git INFINITE_DEPTH keeps complete ancestry on checkout's single-ref path.
          fetch-depth: 2147483647
          fetch-tags: false
          sparse-checkout: '!/*'
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python for PR title
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate PR title and commit range against reviewed base
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import stat
          import subprocess
          import sys
          import tomllib

          base_sha = os.environ.get("BASE_SHA", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          merge_sha = os.environ.get("MERGE_SHA", "")
          title = os.environ.get("PR_TITLE", "")
          if any(
              re.fullmatch(r"[0-9a-f]{40}", sha) is None
              for sha in (base_sha, head_sha, merge_sha)
          ):
              sys.exit("invalid pull request commit identity")
          actual = subprocess.run(
              ["git", "-C", "trusted-base", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              timeout=10,
          ).stdout.strip()
          if actual != base_sha:
              sys.exit("reviewed base identity mismatch")


          def git(*args):
              return subprocess.run(
                  ["git", "-C", "candidate-commits", *args],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  timeout=15,
              ).stdout


          if git("rev-parse", "HEAD").decode("ascii").strip() != merge_sha:
              sys.exit("pull request merge identity mismatch")
          if git("rev-parse", "HEAD^1").decode("ascii").strip() != base_sha:
              sys.exit("pull request base parent mismatch")
          if git("rev-parse", "HEAD^2").decode("ascii").strip() != head_sha:
              sys.exit("pull request head parent mismatch")
          merge_size = git("cat-file", "-s", "HEAD").decode("ascii").strip()
          if not merge_size.isdecimal() or int(merge_size) > 65536:
              sys.exit("pull request merge object is invalid or oversized")
          merge_headers = git("cat-file", "commit", "HEAD").partition(b"\n\n")[0]
          if sum(line.startswith(b"parent ") for line in merge_headers.splitlines()) != 2:
              sys.exit("pull request merge must have exactly two parents")
          if git("rev-parse", "--is-shallow-repository").strip() != b"false":
              sys.exit("pull request history is shallow")
          fd = os.open("trusted-base/.cz.toml", os.O_RDONLY | os.O_NOFOLLOW)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size > 65536:
                  sys.exit("reviewed message configuration must be a bounded regular file")
              content = os.read(fd, 65537)
          finally:
              os.close(fd)
          if len(content) > 65536:
              sys.exit("reviewed message configuration exceeds the input bound")
          config = tomllib.loads(content.decode("utf-8"))
          commitizen = config["tool"]["commitizen"]
          grammar = commitizen["customize"]
          pattern = grammar["schema_pattern"]
          if not isinstance(pattern, str) or not title or "\n" in title or "\r" in title:
              sys.exit("PR title must be one Conventional Commit subject line")
          if re.fullmatch(pattern, title) is None:
              sys.exit("PR title does not match the reviewed message schema")
          print("pr-title result=validated verdict=PASS")
          patterns = {
              name: re.compile(grammar[name])
              for name in (
                  "schema_pattern",
                  "commit_parser",
                  "generated_merge_pattern",
                  "generated_revert_pattern",
              )
          }
          prefixes = commitizen["allowed_prefixes"]
          if not isinstance(prefixes, list) or not all(
              isinstance(p, str) and p for p in prefixes
          ):
              sys.exit("invalid reviewed generated-message prefixes")
          commits = (
              git("rev-list", "--max-count=257", f"{base_sha}..{head_sha}")
              .decode("ascii")
              .splitlines()
          )
          if (
              not commits
              or len(commits) > 256
              or head_sha not in commits
              or any(re.fullmatch(r"[0-9a-f]{40}", sha) is None for sha in commits)
          ):
              sys.exit("pull request commit range is empty, invalid, or exceeds 256 commits")
          for sha in commits:
              size_text = git("cat-file", "-s", sha).decode("ascii").strip()
              if not size_text.isdecimal() or int(size_text) > 65536:
                  sys.exit(f"commit object is invalid or exceeds 65536 bytes: {sha}")
              raw = git("cat-file", "commit", sha)
              if len(raw) != int(size_text):
                  sys.exit(f"commit object size mismatch: {sha}")
              headers, separator, body = raw.partition(b"\n\n")
              if not separator:
                  sys.exit(f"commit message is missing: {sha}")
              message = body.decode("utf-8").rstrip("\n")
              parents = sum(line.startswith(b"parent ") for line in headers.splitlines())
              authored = patterns["schema_pattern"].fullmatch(message) and patterns[
                  "commit_parser"
              ].fullmatch(message)
              generated_merge = (
                  "Merge" in prefixes
                  and parents >= 2
                  and patterns["generated_merge_pattern"].fullmatch(message)
              )
              generated_revert = "Revert" in prefixes and patterns[
                  "generated_revert_pattern"
              ].fullmatch(message)
              if not (authored or generated_merge or generated_revert):
                  sys.exit(f"commit message does not match the reviewed schema: {sha}")
          print(f"pr-commits result=validated verdict=PASS count={len(commits)}")
          PY

  style-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          # The affected plan needs the complete PR ancestry, including multi-commit PRs.
          fetch-depth: 2147483647
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned validation runner
        run: >-
          python -I -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r trusted-base/.github/requirements/ci-validation.txt
      - name: Bind candidate and plan affected checks
        id: plan
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C ../trusted-base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$MERGE_SHA $BASE_SHA $HEAD_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git diff --no-ext-diff --no-textconv --no-renames --name-status -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-changes.z"
          : > "$RUNNER_TEMP/pr-purpose-paths.z"
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' path
            printf '%s\0' "$path" >> "$RUNNER_TEMP/pr-purpose-paths.z"
            case "$status" in
              A|M|T) printf '%s\0' "$path" ;;
              D) ;;
              *) exit 1 ;;
            esac
          done < "$RUNNER_TEMP/pr-changes.z" > "$RUNNER_TEMP/pr-style-paths.z"
          style=false
          if [ -s "$RUNNER_TEMP/pr-style-paths.z" ]; then style=true; fi
          export STYLE_REQUIRED="$style"
          python3 -I scripts/run-validation-lane.py --root . --lane affected --profile pull-request --paths-file "$RUNNER_TEMP/pr-purpose-paths.z" --delimiter nul --base-ref "$BASE_SHA" --plan-output "$RUNNER_TEMP/pr-plan.json"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pr-plan.json").read_text())
          selected = set(plan["validators"])
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              for name, enabled in (
                  ("style", os.environ["STYLE_REQUIRED"] == "true"),
                  ("purpose", bool(selected)),
                  ("kustomize", plan["tools"]["kustomize"]),
                  ("conftest", plan["tools"]["conftest"]),
              ):
                  stream.write(f"{name}={'true' if enabled else 'false'}\n")
          PY
      - name: Lint and format changed files
        id: style
        if: steps.plan.outputs.style == 'true'
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -I ../trusted-base/scripts/validate-selected-style.py --root .
          --config ../trusted-base/.pre-commit-config.yaml
          --markdown-config ../trusted-base/.markdownlint-cli2.yaml
          --ruff-config ../trusted-base/.ruff.toml
          --paths-file "$RUNNER_TEMP/pr-style-paths.z" --delimiter nul
          --expected-base-sha "$BASE_SHA"
      - name: Prepare selected Kustomize renderer
        if: steps.plan.outputs.kustomize == 'true'
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/kustomize.XXXXXX")
          trap 'rm -f "$tool_dir/kustomize.tar.gz" "$tool_dir/kustomize"; rmdir "$tool_dir"' EXIT
          curl --fail --location --show-error --silent --max-time 90 \
            'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz' \
            --output "$tool_dir/kustomize.tar.gz"
          tar -xzf "$tool_dir/kustomize.tar.gz" -C "$tool_dir" kustomize
          printf '%s  %s\n' 'f7b1605aa5143e0dcbd754a4d43c47ad7a560c540b1356b064d69fe236164494' "$tool_dir/kustomize" | sha256sum --check --status
          sudo install -m 0755 "$tool_dir/kustomize" /usr/local/bin/kustomize
      - name: Prepare selected Conftest image
        if: steps.plan.outputs.conftest == 'true'
        run: docker pull 'openpolicyagent/conftest:v0.69.0@sha256:a38ba21668929a00dce2fe6ee43d1312228340bce5fd243f47dd0ce90516e558'
      - name: Validate affected purpose contracts
        id: purpose
        if: steps.plan.outputs.purpose == 'true'
        working-directory: candidate
        run: python3 -I scripts/run-validation-lane.py --root . --lane affected --plan-file "$RUNNER_TEMP/pr-plan.json" --combine-documents
      - name: Verify affected check outcomes
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          STYLE_REQUIRED: ${{ steps.plan.outputs.style }}
          STYLE_OUTCOME: ${{ steps.style.outcome }}
          PURPOSE_REQUIRED: ${{ steps.plan.outputs.purpose }}
          PURPOSE_OUTCOME: ${{ steps.purpose.outcome }}
        run: |
          set -euo pipefail
          test "$PLAN_OUTCOME" = success
          check() {
            case "$2:$3" in
              true:success) printf '%s PASS\n' "$1" ;;
              false:skipped) printf '%s NOT_APPLICABLE\n' "$1" ;;
              *) printf '%s missing or invalid outcome\n' "$1" >&2; return 1 ;;
            esac
          }
          check style "$STYLE_REQUIRED" "$STYLE_OUTCOME"
          check purpose "$PURPOSE_REQUIRED" "$PURPOSE_OUTCOME"
