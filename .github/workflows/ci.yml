name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          event=${EVENT_NAME-}
          base=${BASE_REF-}
          head=${HEAD_REF-}
          source=${SOURCE_REF-}
          missing=0
          if [ "${EVENT_NAME+x}" != x ] || [ "${BASE_REF+x}" != x ] || [ "${HEAD_REF+x}" != x ] || [ "${SOURCE_REF+x}" != x ]; then
            missing=1
          fi
          allowed_branch_regex='^(feat|fix|docs|refactor|test|chore|ci|release|hotfix|codex|dependabot)/'
          branch_result=unknown_event
          branch_verdict=FAIL
          case "$event" in
            pull_request)
              if [ "$base" != main ]; then
                branch_result=invalid_base
                echo 'PR base branch must be main'
              elif ! [[ "$head" =~ $allowed_branch_regex ]]; then
                branch_result=invalid_head
                echo 'PR source branch must start with one of: feat/, fix/, docs/, refactor/, test/, chore/, ci/, release/, hotfix/, codex/, dependabot/'
              else
                branch_result=validated
                branch_verdict=PASS
              fi
              ;;
            push|workflow_dispatch)
              if [ "$source" = refs/heads/main ]; then
                branch_result=NOT_APPLICABLE
                branch_verdict=NOT_APPLICABLE
              else
                branch_result=invalid_ref
              fi
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            branch_result=missing_metadata
            branch_verdict=FAIL
          fi
          printf 'branch-policy result=%s verdict=%s\n' "$branch_result" "$branch_verdict"
          if [ "$branch_verdict" = FAIL ]; then
            exit 1
          fi
          exit 0
      - name: Checkout reviewed base for PR title
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Set up Python for PR title
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate PR title against reviewed base
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import stat
          import subprocess
          import sys
          import tomllib

          base_sha = os.environ.get("BASE_SHA", "")
          title = os.environ.get("PR_TITLE", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              sys.exit("invalid reviewed base identity")
          actual = subprocess.run(
              ["git", "-C", "trusted-base", "rev-parse", "HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          if actual != base_sha:
              sys.exit("reviewed base identity mismatch")
          fd = os.open("trusted-base/.cz.toml", os.O_RDONLY | os.O_NOFOLLOW)
          try:
              info = os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size > 65536:
                  sys.exit("reviewed message configuration must be a bounded regular file")
              content = os.read(fd, 65537)
          finally:
              os.close(fd)
          if len(content) > 65536:
              sys.exit("reviewed message configuration exceeds the input bound")
          config = tomllib.loads(content.decode("utf-8"))
          pattern = config["tool"]["commitizen"]["customize"]["schema_pattern"]
          if not isinstance(pattern, str) or not title or "\n" in title or "\r" in title:
              sys.exit("PR title must be one Conventional Commit subject line")
          if re.fullmatch(pattern, title) is None:
              sys.exit("PR title does not match the reviewed message schema")
          print("pr-title result=validated verdict=PASS")
          PY

  style-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout pull request merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bind base and select changed files
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          git diff --no-ext-diff --no-textconv --no-renames --name-only -z --diff-filter=ACMR HEAD^1 HEAD > "$RUNNER_TEMP/pr-style-paths.z"
      - name: Install pinned style runner
        run: >-
          python -I -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r trusted-base/.github/requirements/ci-validation.txt
      - name: Lint and format changed files
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python -I ../trusted-base/scripts/validate-selected-style.py --root .
          --config ../trusted-base/.pre-commit-config.yaml
          --markdown-config ../trusted-base/.markdownlint-cli2.yaml
          --ruff-config ../trusted-base/.ruff.toml
          --paths-file "$RUNNER_TEMP/pr-style-paths.z" --delimiter nul
          --expected-base-sha "$BASE_SHA"
