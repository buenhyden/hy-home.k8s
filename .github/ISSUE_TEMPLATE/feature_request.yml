name: Feature Request
description: Describe a feature request for triage
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and expected outcome. A maintainer assigns one
        `priority:*` Issue label during triage. The accepted contract belongs
        in a Spec; execution evidence belongs in its Task.
  - type: input
    id: prd_link
    attributes:
      label: Requirement Package / AD Link
      description:
        Link an existing requirement package or architecture description if one exists.
      placeholder: https://github.com/<org>/<repo>/blob/main/docs/01.requirements/<file>.md
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user/business problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected Outcome
      description: What measurable outcome should improve after this feature?
      placeholder: "Example: Reject an unowned namespace with a precise static validation diagnostic"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Proposed Acceptance Ideas (optional)
      description: Suggest testable behavior if known; the accepted criteria are defined in a Spec.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: false
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly state what this request does not include.
    validations:
      required: false
