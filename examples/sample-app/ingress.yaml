# Ingress — ingress-nginx + cert-manager mkcert-ca-issuer
#
# TLS 흐름:
#   cert-manager가 mkcert-ca-issuer로 인증서를 발급하여 <appname>-tls Secret에 저장한다.
#   ingress-nginx가 해당 Secret을 사용하여 TLS 종료를 수행한다.
#
# 접근 URL: https://<appname>.hy-k8s.home.arpa
#
# k8s 전용 router(192.168.0.14:443)가 이 host를 받으므로 외부 저장소 변경은 없다.
# hy-k8s.home.arpa/<appname> 진입이 필요하면
# gitops/platform/ingress-routes/apex-redirects.yaml에 redirect Ingress를 추가한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <appname>
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: mkcert-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  rules:
    - host: <appname>.hy-k8s.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <appname>
                port:
                  number: <port>
  tls:
    - hosts:
        - <appname>.hy-k8s.home.arpa
      secretName: <appname>-tls # pragma: allowlist secret
