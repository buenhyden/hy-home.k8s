# Argo Rollout — canary 전략
#
# 배포 흐름:
#   새 버전 → 20% 트래픽 → AnalysisTemplate 검사(재시작 없음) → pause 30s
#   → 60% → pause 30s → 100% 전환
#
# 이미지: GitHub Container Registry (ghcr.io) 기반
#   - 앱 GitHub 레포: https://github.com/<owner>/<appname>
#   - CI: GitHub Actions → docker build → ghcr.io/<owner>/<appname>:<tag>
#
# 변경 전 필수:
#   - <appname>   → 실제 앱 이름 (소문자, 하이픈)
#   - <owner>     → GitHub 사용자명 또는 조직명
#   - <tag>       → 고정 태그 사용 권장 (latest 지양)
#   - <port>      → 앱이 listen하는 포트
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: <appname>
  namespace: apps
  labels:
    app.kubernetes.io/name: <appname>
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: <appname>
  template:
    metadata:
      labels:
        app.kubernetes.io/name: <appname>
        app.kubernetes.io/component: web
    spec:
      # 플랫폼 워크로드와 동일한 하드닝 기준선이다.
      #
      # runAsNonRoot와 runAsUser는 반드시 함께 설정한다. 이미지가 USER를 이름으로만
      # 선언하면(예: `USER appuser`) kubelet은 기동 전에 이름을 UID로 해석할 수 없어
      # runAsNonRoot만 켠 컨테이너를 거부한다. 숫자 UID를 여기서 지정하면 이미지의
      # USER 선언 형태와 무관하게 성립한다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: <appname>
          image: ghcr.io/<owner>/<appname>:<tag>
          # readOnlyRootFilesystem은 앱이 디스크에 쓰지 않을 때만 그대로 쓴다.
          # 임시 파일·세션·캐시가 필요하면 해당 경로에 emptyDir을 마운트한다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: <port>
          # 환경변수 — 시크릿 연동 시 envFrom 사용 (external-secret.yaml 참조)
          env:
            - name: PORT
              value: '<port>'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz # 앱의 health check 경로로 변경
              port: <port>
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: <port>
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: <appname>-stability
        - pause:
            duration: 30s
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 100
